<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes - User Directory</title>
    <script src="users.js" defer></script>
  </head>

  <body>
    <main>
      <h1>User Directory</h1>

      <button id="load-users" type="button">Load Users</button>

      <label for="filter-input">Filter users by name:</label>
      <input
        type="text"
        id="filter-input"
        placeholder="Enter a name..."
      />

      <p id="status">Click "Load Users" to fetch users.</p>

      <ul id="users-list"></ul>
    </main>
  </body>
</html>

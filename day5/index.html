<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes - Day 5 Users</title>
    <script src="users.js" defer></script>
  </head>

  <body>
    <header>
      <h1>QuickNotes Users</h1>
      <p>Load and filter users from an API.</p>

      <nav aria-label="Main navigation">
        <a href="index.html" aria-current="page">Users</a>
      </nav>
    </header>

    <main>
      <section>
        <h2>Load Users</h2>

        <button id="load-users" type="button">Load Users</button>

        <label for="filter-input">Filter users</label>
        <input
          type="text"
          id="filter-input"
          placeholder="Search by name..."
        />

        <p id="status" aria-live="polite">Click "Load Users" to begin.</p>
      </section>

      <section>
        <h2>User List</h2>

        <ul id="users-list"></ul>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes. Built during Web Foundations.</p>
    </footer>
  </body>
</html>
